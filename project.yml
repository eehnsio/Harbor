name: Harbor
options:
  bundleIdPrefix: com.erik
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
targets:
  Harbor:
    type: application
    platform: macOS
    sources:
      - Harbor
      - path: Harbor/Resources
        buildPhase: resources
    postBuildScripts:
      - name: Embed Git Hash
        # Writes into the built product (not the tracked Info.plist); runs before code signing
        basedOnDependencyAnalysis: false
        script: |
          hash=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "dev")
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then hash="$hash-dirty"; fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :GitCommitHash $hash" "$plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :GitCommitHash string $hash" "$plist"
    settings:
      base:
        INFOPLIST_FILE: Harbor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Harbor/Harbor.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.erik.Harbor
        PRODUCT_NAME: Harbor
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEVELOPMENT_TEAM: 735SV765PC
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          # Distributed outside the App Store → Developer ID + notarization
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
